<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Studying Clock</title>
<style>
  :root {
    --bg: #0e1016;
    --panel: #1d222c;
    --text: #e8eaee;
    --muted: #8a91a0;
    --accent: #4cc2ff;
    --accent-glow: rgba(76, 194, 255, 0.18);
    --danger: #ff5c6b;
  }
  .theme-amber {
    --bg: #141610;
    --panel: #1f1e14;
    --text: #f3ead7;
    --muted: #a8957a;
    --accent: #ffb84d;
    --danger: #ff6a5c;
  }
  .theme-midnight {
    --bg: #0d0f1e;
    --panel: #141a2e;
    --text: #e5ebf7;
    --muted: #7d8aa8;
    --accent: #8b9dff;
    --danger: #ff5c6c;
  }
  .theme-forest {
    --bg: #0d1410;
    --panel: #152018;
    --text: #e6efe8;
    --muted: #8f9f8f;
    --accent: #5ed98a;
    --danger: #ff6b5c;
  }
  .theme-slate {
    --bg: #101318;
    --panel: #1a1f27;
    --text: #e9edf2;
    --muted: #8b95a3;
    --accent: #7ea3f0;
    --danger: #ff6b61;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 32px; gap: 30px;
    user-select: none;
    transition: background 0.3s, color 0.3s;
  }

  /* ---- Clock ---- */
  .clock { text-align: center; }
  .line {
    display: flex; align-items: baseline; justify-content: center;
  }
  .time {
    font-size: clamp(5rem, 17vmin, 11rem);
    font-weight: 250;
    font-variant-numeric: tabular-nums;
    line-height: 1;
    letter-spacing: 0.01em;
  }
  .ampm {
    font-size: clamp(1.4rem, 4.6vmin, 3rem);
    font-weight: 400;
    color: var(--muted);
    margin-left: 0.4em;
  }
  .date { color: var(--muted); font-size: clamp(1rem, 2.2vmin, 1.35rem); margin-top: 14px; letter-spacing: 0.04em; }

  /* ---- Timer ---- */
  .card {
    background: var(--panel);
    border-radius: 18px;
    padding: 22px 28px;
    width: min(540px, 92vw);
    text-align: center;
    transition: background 0.3s, box-shadow 0.3s;
  }
  .card.ringing { animation: cardpulse 0.5s ease-in-out infinite, shake 0.6s linear 2; }
  @keyframes cardpulse {
    0%, 100% { box-shadow: 0 0 0 3px var(--accent); }
    50% { box-shadow: 0 0 0 3px var(--accent), 0 0 30px 8px var(--accent-glow); }
  }
  @keyframes shake {
    10%, 90% { transform: translateX(-1px); }
    20%, 80% { transform: translateX(2px); }
    30%, 50%, 70% { transform: translateX(-3px); }
    40%, 60% { transform: translateX(3px); }
  }
  body.alert::after {
    content: '';
    position: fixed; inset: 0;
    background: var(--accent-glow);
    animation: flashpulse 0.8s ease-in-out infinite;
    pointer-events: none;
    z-index: 10;
  }
  @keyframes flashpulse {
    0%, 100% { opacity: 0;} 
    50% { opacity: 1;}
  }
  .presets { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .btn {
    border: none; background: var(--bg);
    color: var(--text);
    font-size: 1.05rem; padding: 10px 18px;
    border-radius: 10px; cursor: pointer;
    font-family: inherit;
    transition: transform 0.06s, background 0.2s;
  }
  .btn:hover { background: rgba(255, 255, 255, 0.09); }
  .btn:active { transform: scale(0.96); }
  .btn.primary { background: var(--accent); color: #0a0c10; font-weight: 600; }
  .btn.primary:hover { background: var(--accent); }
  .btn.danger { background: var(--danger); color: #fff; font-weight: 600; }
  .btn.danger:hover { background: var(--danger); }

  .disp { margin-top: 20px; }
  .timer-display {
    font-size: clamp(2.6rem, 8vmin, 4.6rem);
    font-weight: 300;
    font-variant-numeric: tabular-nums;
    line-height: 1.1;
    min-height: 1.1em;
  }
  .timer-display.active { color: var(--accent); }
  .timer-display.done { color: var(--danger); }
  .live-dur { color: var(--muted); font-size: 1rem; min-height: 1em; margin-top: 4px; }

  .custom-row { display: flex; gap: 8px; justify-content: center; margin-top: 18px; }
  .row { display: flex; gap: 10px; justify-content: center; margin-top: 12px; flex-wrap: wrap; }

  input[type="number"] {
    background: var(--bg); color: var(--text);
    border: 1px solid rgba(255, 255, 255, 0.14);
    border-radius: 10px; padding: 9px 12px; width: 96px;
    font-size: 1rem; text-align: center;
    font-variant-numeric: tabular-nums;
    font-family: inherit;
  }
  input[type="number"]::-webkit-outer-spin-button,
  input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  input[type="number"]:focus { outline: 2px solid var(--accent); outline-offset: 1px; }

  .vol-wrap { margin-top: 18px; padding-top: 16px; border-top: 1px solid rgba(255,255,255,0.08); }
  .vol-row { display: flex; align-items: center; justify-content: center; gap: 14px; }
  .vol-label { color: var(--muted); font-size: 0.9rem; }
  input[type="range"] {
    -webkit-appearance: none; appearance: none;
    width: 180px; height: 6px; border-radius: 4px;
    background: var(--bg); cursor: pointer;
    outline: none;
  }
  input[type="range"]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 20px; height: 20px; border-radius: 7px;
    background: var(--accent); cursor: pointer;
    border: none;
  }
  input[type="range"]::-moz-range-thumb {
    width: 20px; height: 20px; border-radius: 7px;
    background: var(--accent); cursor: pointer; border: none;
  }
  .vol-test { background: var(--accent); color: #0a0c10; font-weight: 600; padding: 10px 16px; }

  .hint { color: var(--muted); font-size: 0.82rem; text-align: center; }

  /* ---- Theme picker ---- */
  #theme-menu {
    position: fixed; top: 18px; right: 18px;
    display: flex; gap: 8px;
    background: var(--panel); padding: 8px; border-radius: 14px;
    transition: background 0.3s;
  }
  .swatch {
    width: 26px; height: 26px; border-radius: 8px;
    border: 2px solid transparent; cursor: pointer; padding: 0;
  }
  .swatch:hover { transform: scale(1.1); }
  .swatch.sel { border-color: var(--text); }

  /* ---- Layout ---- */
  .layout {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    gap: 26px;
    align-items: center;
    width: 100%;
    max-width: 1500px;
  }
  .center { display: flex; flex-direction: column; align-items: center; gap: 26px; }
  .side { display: flex; justify-content: center; min-width: 0; }
  .side-card {
    background: var(--panel);
    border-radius: 18px;
    padding: 24px 26px;
    width: 100%;
    max-width: 320px;
    text-align: center;
    transition: background 0.3s;
  }
  .side-title {
    color: var(--muted);
    font-size: 0.9rem;
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .side-value {
    font-size: clamp(1.8rem, 5vmin, 3rem);
    font-weight: 300;
    font-variant-numeric: tabular-nums;
    line-height: 1.25;
    margin: 14px 0;
    min-height: 1.25em;
  }
  .side-value.total { color: var(--accent); }
  .clear-btn { width: 100%; }
  .side-note { color: var(--muted); font-size: 0.82rem; margin-top: 10px; min-height: 1em; }

  /* ---- Confirm modal ---- */
  .modal-backdrop {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(0, 0, 0, 0.6);
    display: flex; align-items: center; justify-content: center;
    padding: 16px;
  }
  .modal-backdrop[hidden] { display: none; }
  .modal {
    background: var(--panel);
    border-radius: 16px;
    padding: 26px 28px;
    width: min(380px, 92vw);
    text-align: center;
  }
  .modal-title { font-size: 1.2rem; font-weight: 600; margin-bottom: 8px; }
  .modal-text { color: var(--muted); font-size: 0.96rem; line-height: 1.5; margin-bottom: 22px; }
  .modal-text strong { color: var(--text); }
  .modal-actions { display: flex; gap: 10px; justify-content: center; }
  .modal-actions .btn { min-width: 112px; }

  @media (max-width: 1000px) {
    .layout { grid-template-columns: 1fr; gap: 20px; }
    .center { order: 1; }
    .left-side { order: 2; }
    .right-side { order: 3; }
    .side-card { max-width: 100%; }
  }

  @media (max-width: 560px) {
    body { gap: 22px; padding: 20px; }
    .card { padding: 18px 16px; width: 100%; }
    .side-card { padding: 18px 16px; }
  }
</style>
</head>
<body>
  <div id="theme-menu" role="radiogroup" aria-label="Theme"></div>

  <div class="layout">
    <aside class="side left-side">
      <div class="side-card">
        <div class="side-title">Total time</div>
        <div class="side-value total" id="totalDisp">0:00:00</div>
        <button class="btn danger clear-btn" id="clearTotalBtn" type="button">Clear total</button>
      </div>
    </aside>

    <div class="center">
      <div class="clock">
        <div class="line">
          <span class="time" id="time">--:--</span>
          <span class="ampm" id="ampm"></span>
        </div>
        <div class="date" id="date"></div>
      </div>

      <div class="card">
        <div class="presets">
          <button class="btn" onclick="startTimer(15)">15 min</button>
          <button class="btn" onclick="startTimer(30)">30 min</button>
          <button class="btn" onclick="startTimer(45)">45 min</button>
          <button class="btn" onclick="startTimer(60)">1 hr</button>
          <button class="btn" onclick="startTimer(90)">90 min</button>
        </div>
        <div class="disp">
          <div class="timer-display" id="tDisp">--:--</div>
          <div class="live-dur" id="liveDur"></div>
        </div>
        <div class="custom-row">
          <input type="number" id="mins" min="1" max="600">
          <button class="btn primary" onclick="customStart()">Timer</button>
        </div>
        <div class="row">
          <button class="btn danger" id="stopBtn" onclick="stopTimer()" style="display:none">Stop</button>
        </div>
        <div class="vol-wrap">
          <div class="vol-row">
            <span class="vol-label">Alarm volume</span>
            <input type="range" id="volSlider" min="0" max="100" value="50">
            <button class="btn vol-test" onclick="testAlarm()">Test</button>
          </div>
        </div>
      </div>
    </div>

    <aside class="side right-side">
      <div class="side-card">
        <div class="side-title">Stopwatch</div>
        <div class="side-value" id="swDisp">0:00:00</div>
        <div class="row">
          <button class="btn primary" id="swToggle" type="button" style="min-width:112px">Start</button>
          <button class="btn danger" id="swStop" type="button">Stop</button>
        </div>
        <div class="side-note">Stop adds the time to your total</div>
      </div>
    </aside>
  </div>

  <div class="hint">The clock is always first. Finished timers and stopwatches are added to your total.</div>

  <div class="modal-backdrop" id="confirmModal" hidden>
    <div class="modal">
      <div class="modal-title">Clear total time?</div>
      <div class="modal-text" id="confirmText"></div>
      <div class="modal-actions">
        <button class="btn" id="confirmNo" type="button">Cancel</button>
        <button class="btn danger" id="confirmYes" type="button">Clear</button>
      </div>
    </div>
  </div>

<script>
  "use strict";

  /* ---------- Clock ---------- */
  const timeEl = document.getElementById('time');
  const ampmEl = document.getElementById('ampm');
  const dateEl = document.getElementById('date');

  function pad(n) { return String(n).padStart(2, '0'); }

  function tick() {
    const now = new Date();
    let h = now.getHours();
    const ampm = h >= 12 ? 'PM' : 'AM';
    h = h % 12; if (h === 0) h = 12;
    timeEl.textContent = h + ':' + pad(now.getMinutes());
    ampmEl.textContent = ampm;
    dateEl.textContent = now.toLocaleDateString(undefined,
      { weekday: 'long', month: 'long', day: 'numeric' });
  }
  setInterval(tick, 1000);
  tick();

  /* ---------- Timer ---------- */
  const tDisp = document.getElementById('tDisp');
  const liveDur = document.getElementById('liveDur');
  const stopBtn = document.getElementById('stopBtn');
  const cardEl = document.querySelector('.card');

  let endAt = null;
  let totalMs = 0;
  let bookedMs = 0;
  let finished = false;
  let finishTO = null;
  let timerInt = null;   // display interval (setInterval, works in background tabs)
  let alarmInt = null;   // repeating alarm burst while ringing
  let notifyInt = null;  // repeats OS notification while ringing & tab hidden
  const STORE_KEY = 'clockTimer';
  const VOL_KEY = 'clockVolume';
  let alarmVolume = parseFloat(localStorage.getItem(VOL_KEY));
  if (!(alarmVolume >= 0 && alarmVolume <= 1)) alarmVolume = 0.5;

  const volSlider = document.getElementById('volSlider');
  volSlider.value = Math.round(alarmVolume * 100);
  volSlider.addEventListener('input', () => {
    alarmVolume = volSlider.value / 100;
    localStorage.setItem(VOL_KEY, String(alarmVolume));
  });
  function testAlarm() {
    unlockAudio();   // Test click is a user gesture that unlocks audio
    alarm();
  }

  /* ---------- Total time & stopwatch ---------- */
  const DUR_KEY = 'clockTimerDuration';
  const TOTAL_KEY = 'clockTotalSeconds';
  const totalDisp = document.getElementById('totalDisp');
  const clearTotalBtn = document.getElementById('clearTotalBtn');
  const swDisp = document.getElementById('swDisp');
  const swToggle = document.getElementById('swToggle');
  const swStopBtn = document.getElementById('swStop');

  let totalSeconds = parseInt(localStorage.getItem(TOTAL_KEY), 10);
  if (!(totalSeconds > 0)) totalSeconds = 0;

  function fmtHMS(ms) {
    const s = Math.max(0, Math.floor(ms / 1000));
    const hh = Math.floor(s / 3600);
    const mm = Math.floor((s % 3600) / 60);
    const ss = s % 60;
    return hh + ':' + pad(mm) + ':' + pad(ss);
  }
  function renderTotal() { totalDisp.textContent = fmtHMS(totalSeconds * 1000); }
  function addToTotal(ms) {
    totalSeconds += Math.round(ms / 1000);
    localStorage.setItem(TOTAL_KEY, String(totalSeconds));
    renderTotal();
  }

  let swRunning = false;
  let swStartMs = 0;
  let swAccumMs = 0;
  let swInt = null;

  function swElapsed() {
    return swAccumMs + (swRunning ? Date.now() - swStartMs : 0);
  }
  function renderSW() { swDisp.textContent = fmtHMS(swElapsed()); }

  swToggle.addEventListener('click', () => {
    if (swRunning) {
      swAccumMs += Date.now() - swStartMs;
      swRunning = false;
      clearInterval(swInt); swInt = null;
      swToggle.textContent = 'Start';
      renderSW();
    } else {
      swRunning = true;
      swStartMs = Date.now();
      swInt = setInterval(renderSW, 250);
      swToggle.textContent = 'Pause';
      renderSW();
    }
  });

  swStopBtn.addEventListener('click', () => {
    const ms = swElapsed();
    swRunning = false;
    swStartMs = 0;
    swAccumMs = 0;
    clearInterval(swInt); swInt = null;
    swToggle.textContent = 'Start';
    renderSW();
    if (ms >= 1000) addToTotal(ms);
  });

  /* Confirm dialog for clearing the total */
  const confirmModal = document.getElementById('confirmModal');
  const confirmText = document.getElementById('confirmText');
  clearTotalBtn.addEventListener('click', () => {
    if (totalSeconds <= 0) return;
    confirmText.innerHTML = 'This removes <strong>' + fmtHMS(totalSeconds * 1000) +
      '</strong> of study time and can\'t be undone.';
    confirmModal.hidden = false;
  });
  document.getElementById('confirmYes').addEventListener('click', () => {
    totalSeconds = 0;
    localStorage.removeItem(TOTAL_KEY);
    renderTotal();
    confirmModal.hidden = true;
  });
  document.getElementById('confirmNo').addEventListener('click', () => {
    confirmModal.hidden = true;
  });
  confirmModal.addEventListener('click', (e) => {
    if (e.target === confirmModal) confirmModal.hidden = true;
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !confirmModal.hidden) confirmModal.hidden = true;
  });
  renderTotal();

  function fmt(ms) {
    const total = Math.max(0, Math.ceil(ms / 1000));
    const hh = Math.floor(total / 3600);
    const mm = Math.floor((total % 3600) / 60);
    const ss = total % 60;
    return (hh ? pad(hh) + ':' : '') + pad(mm) + ':' + pad(ss);
  }
  function fmtLong(ms) {
    const min = Math.round(ms / 60000);
    if (min >= 60) return Math.round(min / 60) + ' hr';
    return min + ' min';
  }

  /* Alarm. Needs a prior user gesture (a timer button click) to unlock audio.
     Square-wave bursts at volume that cuts through music. The burst is
     scheduled on the Web Audio clock so it keeps to schedule in background
     tabs even when JS timers are throttled. */
  let audioCtx = null;

  function unlockAudio() {
    try {
      audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    } catch (e) { /* no audio support */ }
  }

  // Schedule one 9-blip burst beginning at "now" (3 groups of 3, 880/660 Hz)
  function scheduleBurst(when) {
    const t0 = when;
    if (!audioCtx || audioCtx.state === 'closed') return;
    [0, 0.12, 0.24, 0.6, 0.72, 0.84, 1.2, 1.32, 1.44].forEach((off, i) => {
      const start = t0 + off;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'square';
      osc.frequency.value = i % 2 ? 660 : 880;
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(alarmVolume, start + 0.015);
      gain.gain.setValueAtTime(alarmVolume, start + 0.08);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.12);
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.start(start); osc.stop(start + 0.14);
    });
  }
  function alarm() {
    if (!audioCtx) return;
    scheduleBurst(audioCtx.currentTime);
  }

  /* OS notifications: the piece that works even when this tab is hidden in the
     background (JS timers + Web Audio are suspended for hidden tabs, the
     notification banner/sound is not). */
  function requestNotifyPermission() {
    if (!('Notification' in window)) return;
    if (Notification.permission === 'default') {
      Notification.requestPermission().catch(() => {});
    }
  }
  function sendNotification() {
    if (!document.hidden) return;               // visible: in-page beep + flash cover it
    if (!('Notification' in window) || Notification.permission !== 'granted') return;
    const now = new Date();
    const n = new Notification('Time is up', {
      body: 'Your studying timer finished at ' +
        now.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }),
      tag: 'clockTimerDone',
      renotify: true,
    });
    n.onclick = () => { window.focus(); };
  }

  function startTimer(minutes) {
    stopTimer();
    endAt = Date.now() + minutes * 60000;
    totalMs = minutes * 60000;
    bookedMs = totalMs;
    finished = false;
    localStorage.setItem(STORE_KEY, String(endAt));
    localStorage.setItem(DUR_KEY, String(bookedMs));
    liveDur.textContent = fmtLong(totalMs) + ' timer';
    tDisp.classList.remove('active', 'done');
    stopBtn.style.display = '';
    unlockAudio();             // this click unlocks audio for the background alarm
    requestNotifyPermission(); // this click may show the one-time permission prompt
    renderTick();
    timerInt = setInterval(renderTick, 250);
    // Single long timeout for the real deadline — interval throttling won't delay it.
    finishTO = setTimeout(finish, endAt - Date.now());
  }

  function customStart() {
    const v = parseInt(document.getElementById('mins').value, 10);
    if (!isNaN(v) && v > 0) startTimer(v);
  }

  function stopTimer() {
    clearTimeout(finishTO); finishTO = null;
    finished = false;
    endAt = null;
    clearInterval(timerInt); timerInt = null;
    clearInterval(alarmInt); alarmInt = null;
    clearInterval(notifyInt); notifyInt = null;
    localStorage.removeItem(STORE_KEY);
    localStorage.removeItem(DUR_KEY);
    tDisp.textContent = '--:--';
    liveDur.textContent = '';
    tDisp.classList.remove('active', 'done');
    stopBtn.style.display = 'none';
    cardEl.classList.remove('ringing');
    document.body.classList.remove('alert');
  }

  function renderTick() {
    if (!endAt) return;
    const rem = endAt - Date.now();
    tDisp.textContent = fmt(rem);
    tDisp.classList.add('active');
    if (rem <= 0) {
      tDisp.classList.remove('active');
      tDisp.classList.add('done');
      finish();
    }
  }

  function finish() {
    if (finished) return;
    finished = true;
    addToTotal(bookedMs);
    clearTimeout(finishTO); finishTO = null;
    clearInterval(timerInt); timerInt = null;
    endAt = null;
    localStorage.removeItem(STORE_KEY);
    localStorage.removeItem(DUR_KEY);
    liveDur.textContent = 'Time is up';
    cardEl.classList.add('ringing');
    document.body.classList.add('alert');
    tDisp.classList.add('done');
    unlockAudio();
    alarm();
    // Keep ringing (every 2s) until the user presses Stop.
    if (alarmInt === null) {
      alarmInt = setInterval(() => { alarm(); }, 2000);
    }
    // If the tab is hidden, an OS notification (sound + banner) is the only
    // thing that speaks up — JS timers and the in-page beep are suspended.
    let notifyLeft = 9;
    sendNotification();
    if (notifyInt === null) {
      notifyInt = setInterval(() => {
        if (!document.hidden && notifyInt) { clearInterval(notifyInt); notifyInt = null; return; }
        if (notifyLeft-- > 0) sendNotification();
        else { clearInterval(notifyInt); notifyInt = null; }
      }, 30000);
    }
  }

  /* When the user comes back to the tab mid-ring, the in-page alarm is already
     running; just make sure we re-announce if we were overdue the whole time. */

  /* Survive sleep / reload: resume from stored deadline. */
  function restoreTimer() {
    const saved = localStorage.getItem(STORE_KEY);
    if (!saved) return;
    const deadline = parseInt(saved, 10);
    if (isNaN(deadline)) { localStorage.removeItem(STORE_KEY); return; }
    const remaining = deadline - Date.now();
    if (remaining <= 0) {
      // Was due while we were away: go straight into ringing state.
      finished = false;
      bookedMs = parseInt(localStorage.getItem(DUR_KEY), 10) || 0;
      endAt = deadline;
      liveDur.textContent = 'Time is up';
      cardEl.classList.add('ringing');
      document.body.classList.add('alert');
      tDisp.textContent = '00:00';
      tDisp.classList.add('done');
      stopBtn.style.display = '';
      unlockAudio();
      finish();
      return;
    }
    startTimerNoStore(remaining);
  }

  function startTimerNoStore(remainingMs) {
    endAt = Date.now() + remainingMs;
    totalMs = remainingMs;
    bookedMs = parseInt(localStorage.getItem(DUR_KEY), 10) || remainingMs;
    finished = false;
    liveDur.textContent = fmtLong(totalMs) + ' timer';
    tDisp.classList.remove('done', 'active');
    stopBtn.style.display = '';
    renderTick();
    timerInt = setInterval(renderTick, 250);
    finishTO = setTimeout(finish, remainingMs);
  }

  /* On focus, re-check the deadline (covers a frozen/throttled tab). */
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && endAt && endAt - Date.now() <= 0) finish();
  });
  window.addEventListener('focus', () => {
    if (endAt && endAt - Date.now() <= 0) finish();
  });

  /* ---------- Themes ---------- */
  const themes = [
    { id: 'dark',     label: 'Dark',     bg: '#0e1016' },
    { id: 'amber',    label: 'Amber',    bg: '#141610' },
    { id: 'midnight', label: 'Midnight', bg: '#0f1220' },
    { id: 'forest',   label: 'Forest',   bg: '#0d1410' },
    { id: 'slate',    label: 'Slate',    bg: '#101318' },
  ];
  const menu = document.getElementById('theme-menu');
  let activeTheme = localStorage.getItem('theme') || 'dark';

  function applyTheme(t) {
    document.body.classList.remove(...themes.map(x => 'theme-' + x.id));
    if (t !== 'dark') document.body.classList.add('theme-' + t);
    activeTheme = t;
    localStorage.setItem('theme', t);
    renderSwatches();
  }
  function renderSwatches() {
    menu.innerHTML = '';
    themes.forEach(t => {
      const b = document.createElement('button');
      b.className = 'swatch' + (t.id === activeTheme ? ' sel' : '');
      b.style.background = t.bg;
      b.title = t.label;
      b.setAttribute('aria-label', t.label);
      b.type = 'button';
      b.onclick = () => applyTheme(t.id);
      menu.appendChild(b);
    });
  }
  if (activeTheme !== 'dark') document.body.classList.add('theme-' + activeTheme);
  renderSwatches();
  restoreTimer();
  </script>
</body>
</html>
